services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Single-node replica set so mongoose can use multi-document transactions
    # (needed for atomic stock updates in movementService). Initiated once by
    # the backend on startup — see src/db/connect.ts.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      # Talks to the mongo service by its compose network name, not localhost.
      MONGODB_URI: "mongodb://mongo:27017/wms_pyme?directConnection=true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Development default; the integration tests alone make ~300 requests.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1000}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
