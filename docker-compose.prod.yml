# Production (VPS): Caddy (HTTPS + portal) → API → MongoDB. Only Caddy
# publishes ports; Docker bypasses ufw, so mongo and api must stay internal.
#
#   docker compose -f docker-compose.prod.yml up -d --build   (reads DOMAIN and JWT_SECRET from .env)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: "mongodb://mongo:27017/wms_pyme?directConnection=true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      SEED_DEMO: "false"
      TRUST_PROXY: 1
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
