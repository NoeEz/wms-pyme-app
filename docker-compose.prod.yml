# Production (VPS): host nginx (HTTPS, wms.devsoftmx.com) → web (Caddy:
# portal + /api proxy) on 127.0.0.1:3003 → API → MongoDB. Docker bypasses
# ufw, so nothing else publishes ports and web listens on loopback only.
#
#   docker compose -f docker-compose.prod.yml up -d --build   (reads JWT_SECRET from .env)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Small cache: the VPS is shared with other stacks (default is ~50% of RAM).
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGODB_URI: "mongodb://mongo:27017/wms_pyme?directConnection=true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      SEED_DEMO: "false"
      # Two proxies in front (host nginx, then Caddy) for the client's IP.
      TRUST_PROXY: 2
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3003}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

volumes:
  mongo_data:
