# Host nginx site for the WMS (copy to /etc/nginx/sites-available/wms and
# enable it). certbot --nginx -d wms.devsoftmx.com then adds HTTPS and the
# http→https redirect to this same file.
server {
    listen 80;
    listen [::]:80;
    server_name wms.devsoftmx.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
